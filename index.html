<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First payment link after approval</title>
<meta name="description" content="JobNimbus FIN-2045 - send a payment link on open invoices after payments approval.">
<!--
  FIN-2045 - JobNimbus post-approval "send first payment link" screen.
  Product screen extracted from the review concept. The account state that the
  concept exposed through a controls panel is set here with config constants
  (ACCOUNT_STATUS, SCOPE, ACH_ENABLED, SOUTH_BRANCH_EIN) that stand in for values
  that come from the backend account + feature flags in production.

  Gating (enforced server-side / by the app shell, not in this static page):
  admin only (access.settings), behind the stripe-payments flag.
  Paid / processing / failed row states are driven by Stripe payment events
  (webhooks) in production; this page renders whatever state the data carries.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    --white: #ffffff;
    --gray-25: #f9fafb; --gray-50: #f3f5f7; --gray-100: #f0f3f4; --gray-200: #e2e7e9;
    --gray-300: #d3dbdf; --gray-400: #c4cfd4; --gray-500: #a7b6be; --gray-600: #86a0ac;
    --gray-700: #688797; --gray-800: #536c79; --gray-900: #3f515a; --gray-950: #263238;
    --brand-50: #eff3fa; --brand-100: #ebf0fa; --brand-200: #d9e1f2; --brand-600: #7a8fb8;
    --brand-700: #60759f; --brand-800: #475c85; --brand-900: #324467; --brand-950: #1f2c47;
    --success-25: #f6fefb; --success-50: #edfdf7; --success-200: #d1faec; --success-700: #33cc99;
    --success-800: #1fad7e; --success-900: #0f8a61; --success-950: #056243;
    --warning-50: #fff3eb; --warning-200: #ffe2cc; --warning-700: #b54708; --warning-800: #93370d;
    --error-50: #fef3f2; --error-200: #fecdca; --error-600: #d92d20; --error-700: #b42318;
    --info-50: #eff6fe; --info-200: #bcd4f8; --info-700: #175cd3; --info-800: #1849a9;

    --page: var(--gray-50);
    --surface: var(--white);
    --surface-subtle: var(--gray-25);
    --text-primary: var(--gray-950);
    --text-secondary: var(--gray-800);
    --text-tertiary: var(--gray-700);
    --border: var(--gray-200);
    --border-strong: var(--gray-300);
    --brand-solid: var(--brand-900);
    --brand-solid-hover: var(--brand-950);
    --fg-brand: var(--brand-900);
    --nav-grad: linear-gradient(45deg, var(--brand-950) 0%, var(--brand-800) 100%);

    --shadow-xs: 0 1px 2px rgba(10,13,18,.05);
    --shadow-md: 0 4px 8px -2px rgba(16,24,40,.1), 0 2px 4px -2px rgba(16,24,40,.06);
    --shadow-lg: 0 12px 16px -4px rgba(16,24,40,.08), 0 4px 6px -2px rgba(16,24,40,.03);
    --shadow-xl: 0 20px 24px -4px rgba(16,24,40,.08), 0 8px 8px -4px rgba(16,24,40,.03);
    --ring-focus: 0 0 0 4px rgba(96,117,159,.35);

    --r-sm: 6px; --r-md: 8px; --r-lg: 10px; --r-xl: 12px; --r-2xl: 16px;
    --sans: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "DM Mono", "SF Mono", Monaco, Consolas, monospace;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page); color: var(--text-primary);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
  p { margin: 0; }
  button { font-family: inherit; }
  a { color: var(--fg-brand); }
  .mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* top nav */
  .nav { background: var(--nav-grad); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--brand-950); z-index: 21; }
  .nav-inner {
    max-width: 1120px; margin: 0 auto; padding-block: 14px;
    padding-left: max(24px, env(safe-area-inset-left,0px)); padding-right: max(24px, env(safe-area-inset-right,0px));
    display: flex; align-items: center; gap: 32px;
  }
  .brand-logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: #fff; white-space: nowrap; text-transform: uppercase; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--success-700); color: var(--brand-950); display: inline-flex; align-items: center; justify-content: center; }
  .brand-mark svg { width: 17px; height: 17px; }
  .nav-links { display: flex; gap: 2px; margin-left: 4px; font-size: 14px; font-weight: 500; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a { color: rgba(255,255,255,.72); text-decoration: none; white-space: nowrap; padding: 7px 12px; border-radius: var(--r-md); }
  .nav-links a:hover { color: #fff; background: rgba(255,255,255,.1); }
  .nav-links a.active { color: #fff; background: rgba(255,255,255,.16); font-weight: 600; }

  .shell {
    max-width: 1120px; margin: 0 auto; padding-block: 28px 56px;
    padding-left: max(24px, env(safe-area-inset-left,0px)); padding-right: max(24px, env(safe-area-inset-right,0px));
    display: flex; flex-direction: column; gap: 20px;
  }

  .eyebrow { font-size: 13px; font-weight: 600; color: var(--fg-brand); display: inline-flex; align-items: center; gap: 7px; }
  .eyebrow.done { color: var(--success-950); }
  .eyebrow .ex { width: 16px; height: 16px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; line-height: 18px; padding: 2px 8px; border-radius: 999px; }
  .badge .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-success { background: var(--success-50); color: var(--success-950); box-shadow: inset 0 0 0 1px var(--success-200); }
  .badge-gray { background: var(--gray-50); color: var(--text-secondary); box-shadow: inset 0 0 0 1px var(--border); }
  .badge-warning { background: var(--warning-50); color: var(--warning-800); box-shadow: inset 0 0 0 1px var(--warning-200); }
  .badge-error { background: var(--error-50); color: var(--error-700); box-shadow: inset 0 0 0 1px var(--error-200); }
  .badge-info { background: var(--info-50); color: var(--info-800); box-shadow: inset 0 0 0 1px var(--info-200); }
  .badge-paid { background: var(--success-900); color: #fff; }

  /* banners */
  .banner { border-radius: var(--r-xl); padding: 22px 24px; display: flex; gap: 18px; align-items: flex-start; }
  .banner.is-success { background: var(--success-50); border: 1px solid var(--success-200); box-shadow: var(--shadow-xs); }
  .banner.is-pending { background: var(--warning-50); border: 1px solid var(--warning-200); box-shadow: var(--shadow-xs); }
  .banner-icon { flex: none; width: 46px; height: 46px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; }
  .banner.is-success .banner-icon { background: var(--success-900); }
  .banner.is-pending .banner-icon { background: var(--warning-700); }
  .banner-icon svg { width: 24px; height: 24px; }
  .banner-body { min-width: 0; }
  .banner h1 { font-size: clamp(21px, 3vw, 26px); font-weight: 700; color: var(--text-primary); margin-top: 8px; letter-spacing: -0.025em; }
  .banner p { margin-top: 6px; max-width: 66ch; color: var(--text-secondary); font-size: 15px; }
  .payout-chip { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; background: var(--white); border: 1px solid var(--border); padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text-secondary); }
  .payout-chip .num { color: var(--text-primary); font-weight: 500; letter-spacing: .02em; }
  .bank-ico { width: 16px; height: 16px; flex: none; color: var(--text-tertiary); }

  /* Stripe notification banner (requirements due). Stripe renders its own
     Notification Banner here in production (Managed Risk). */
  .stripe-banner { border: 1px solid #d6c3b0; background: #fff8f1; border-radius: var(--r-xl); padding: 18px 20px; display: flex; gap: 16px; align-items: flex-start; }
  .stripe-icon { flex: none; width: 40px; height: 40px; border-radius: 9px; background: #635bff; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
  .stripe-banner h2 { font-size: 16px; color: #7a3d14; }
  .stripe-banner p { font-size: 13.5px; color: #8a5636; margin-top: 4px; max-width: 70ch; }
  .stripe-banner .btn-stripe { margin-top: 12px; background: #635bff; color: #fff; border: none; border-radius: var(--r-lg); font-weight: 600; font-size: 13px; padding: 9px 14px; cursor: pointer; }

  /* cards */
  .card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-xs); border-radius: var(--r-xl); }
  .step-card { overflow: hidden; }
  .step-head { padding: 22px 24px 0; display: flex; flex-direction: column; gap: 4px; }
  .step-head h2 { font-size: clamp(18px, 2.2vw, 20px); font-weight: 600; margin-top: 4px; color: var(--text-primary); }
  .step-sub { color: var(--text-secondary); margin-top: 2px; font-size: 14px; max-width: 74ch; }
  .progress-note { margin-top: 16px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-secondary); font-weight: 500; }
  .progress-track { flex: 1; max-width: 240px; height: 8px; border-radius: 999px; background: var(--gray-200); overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--success-700); border-radius: 999px; transition: width .5s cubic-bezier(.4,0,.2,1); }

  .paid-head { padding: 22px 24px 0; display: flex; gap: 16px; align-items: flex-start; }
  .paid-head .pico { width: 46px; height: 46px; border-radius: 10px; flex: none; background: var(--success-900); color: #fff; display: flex; align-items: center; justify-content: center; }
  .paid-head .pico svg { width: 24px; height: 24px; }
  .paid-head h2 { font-size: clamp(19px, 2.4vw, 22px); font-weight: 700; color: var(--text-primary); }
  .paid-head p { color: var(--text-secondary); margin-top: 4px; font-size: 14px; }

  /* table */
  .table-wrap { margin-top: 18px; overflow-x: auto; }
  table.invoices { width: 100%; border-collapse: collapse; min-width: 820px; }
  table.invoices.scope-account { min-width: 940px; }
  table.invoices thead th { text-align: left; font-size: 13px; color: var(--text-secondary); font-weight: 500; padding: 11px 16px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.invoices thead th:first-child, table.invoices tbody td:first-child { padding-left: 24px; }
  table.invoices thead th.num, table.invoices td.num { text-align: right; }
  table.invoices thead th.act, table.invoices td.act { text-align: right; white-space: nowrap; }
  table.invoices tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13.5px; color: var(--text-secondary); }
  table.invoices tbody tr:last-child td { border-bottom: none; }
  table.invoices tbody tr:hover td { background: var(--surface-subtle); }
  .cust { font-weight: 600; color: var(--text-primary); font-size: 14px; }
  .inv-no { color: var(--text-secondary); }
  .sendto { display: inline-flex; align-items: center; gap: 6px; }
  .sendto svg { width: 14px; height: 14px; flex: none; color: var(--text-tertiary); }
  .bal { font-weight: 600; color: var(--text-primary); }
  .due-over { color: var(--error-700); font-weight: 500; }
  .loc-pill { font-size: 12px; color: var(--text-secondary); }

  .sent-cell { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .sent-actions { display: flex; gap: 14px; }
  .linklike { background: none; border: none; padding: 0; cursor: pointer; color: var(--fg-brand); font-weight: 600; font-size: 13px; font-family: var(--sans); }
  .linklike:hover { color: var(--brand-950); text-decoration: underline; }
  .state-help { display: block; font-size: 12px; color: var(--text-secondary); max-width: 200px; text-align: right; line-height: 1.35; white-space: normal; }
  tr.row-paid td { background: var(--success-25); }
  tr.row-paid:hover td { background: var(--success-25); }

  /* buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: var(--r-lg); font-weight: 600; font-size: 14px; cursor: pointer; padding: 9px 14px; transition: background .15s, box-shadow .15s, color .15s; white-space: nowrap; }
  .btn:disabled { opacity: .65; cursor: default; }
  .btn-sm { padding: 7px 12px; font-size: 13px; }
  .btn-primary { background: var(--brand-solid); color: #fff; box-shadow: var(--shadow-xs); }
  .btn-primary:hover:not(:disabled) { background: var(--brand-solid-hover); }
  .btn-primary:focus-visible { box-shadow: var(--ring-focus); outline: none; }
  .btn-secondary { background: var(--surface); color: var(--text-secondary); box-shadow: inset 0 0 0 1px var(--border-strong), var(--shadow-xs); }
  .btn-secondary:hover:not(:disabled) { background: var(--gray-50); color: var(--text-primary); }
  .btn-secondary:focus-visible { box-shadow: inset 0 0 0 1px var(--border-strong), var(--ring-focus); outline: none; }

  .step-foot { padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--border); background: var(--surface-subtle); flex-wrap: wrap; }
  .foot-note { font-size: 12.5px; color: var(--text-secondary); }
  .viewall { padding: 14px 24px; border-top: 1px solid var(--border); }
  .viewall a { font-weight: 600; font-size: 13.5px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .viewall a:hover { text-decoration: underline; }

  .empty { padding: 44px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
  .empty .eico { width: 48px; height: 48px; border-radius: 12px; background: var(--gray-50); border: 1px solid var(--border); color: var(--text-tertiary); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
  .empty .eico svg { width: 24px; height: 24px; }
  .empty h2 { font-size: 17px; }
  .empty p { color: var(--text-secondary); max-width: 46ch; }
  .empty .empty-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }

  /* bottom cards */
  .nexts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .next-card { text-align: left; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-xs); border-radius: var(--r-xl); padding: 20px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .15s, border-color .15s; font: inherit; color: inherit; text-decoration: none; }
  .next-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
  .next-card:focus-visible { border-color: var(--brand-600); box-shadow: var(--ring-focus); outline: none; }
  .next-ico { width: 40px; height: 40px; border-radius: 10px; flex: none; background: var(--gray-50); color: var(--text-tertiary); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px var(--border); }
  .next-ico svg { width: 20px; height: 20px; }
  .next-title-row { display: flex; align-items: center; gap: 8px; }
  .next-title { font-weight: 600; font-size: 15px; color: var(--text-primary); }
  .next-sub { color: var(--text-secondary); font-size: 13.5px; }
  .next-link { color: var(--fg-brand); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .next-card .chev { margin-left: auto; color: var(--gray-500); transition: transform .15s; }
  .next-card:hover .chev { transform: translateX(3px); color: var(--text-tertiary); }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(38,50,56,.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; opacity: 0; transition: opacity .18s; }
  .scrim.show { opacity: 1; }
  .modal { background: var(--surface); border-radius: var(--r-2xl); box-shadow: var(--shadow-xl); width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; padding: 22px; transform: translateY(8px) scale(.98); transition: transform .18s; }
  .scrim.show .modal { transform: none; }
  .modal-featured { width: 44px; height: 44px; border-radius: 10px; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; background: var(--brand-50); color: var(--brand-900); box-shadow: inset 0 0 0 1px var(--brand-200); }
  .modal-featured svg { width: 22px; height: 22px; }
  .modal h3 { font-size: 18px; font-weight: 600; color: var(--text-primary); }
  .modal .modal-sub { color: var(--text-secondary); margin-top: 4px; font-size: 14px; }
  .summary-box { margin-top: 16px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-subtle); padding: 2px 16px; }
  .summary-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .k { color: var(--text-secondary); }
  .summary-row .v { font-weight: 600; text-align: right; color: var(--text-primary); }
  .fee-line { margin-top: 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); flex-wrap: wrap; }
  .fee-line svg { width: 15px; height: 15px; flex: none; color: var(--text-tertiary); }
  .methods-line { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
  .methods-line svg { width: 15px; height: 15px; flex: none; color: var(--text-tertiary); }
  .limit-warn { margin-top: 14px; display: flex; gap: 8px; background: var(--warning-50); border: 1px solid var(--warning-200); color: var(--warning-800); border-radius: var(--r-md); padding: 10px 12px; font-size: 12.5px; }
  .modal-actions { display: flex; gap: 12px; margin-top: 22px; }
  .modal-actions .btn { flex: 1; padding: 10px 16px; }

  /* toast */
  .toast-wrap { position: fixed; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom,0px)); display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 60; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left,0px)); padding-right: max(16px, env(safe-area-inset-right,0px)); }
  .toast { background: var(--surface); color: var(--text-primary); border: 1px solid var(--border); box-shadow: var(--shadow-lg); border-radius: var(--r-xl); padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; max-width: 420px; width: 100%; animation: toastIn .3s cubic-bezier(.2,.8,.2,1); }
  .toast .tfeat { width: 34px; height: 34px; flex: none; border-radius: 8px; background: var(--success-50); color: var(--success-950); box-shadow: inset 0 0 0 1px var(--success-200); display: inline-flex; align-items: center; justify-content: center; }
  .toast .tfeat svg { width: 17px; height: 17px; }
  .toast .tbody { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .toast .tt { font-weight: 600; font-size: 14px; color: var(--text-primary); }
  .toast .ts { font-size: 13px; color: var(--text-secondary); word-break: break-word; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .toast.out { animation: toastOut .3s forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translateY(14px); } }

  @media (max-width: 900px) { .nexts { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    .shell { padding: 22px 16px 28px; }
    .nav-inner { padding: 12px 16px; gap: 18px; }
    .banner { padding: 18px; }
    .table-wrap { overflow-x: visible; padding: 0 16px; }
    table.invoices, table.invoices.scope-account { min-width: 0; display: block; }
    table.invoices thead { display: none; }
    table.invoices tbody { display: block; }
    table.invoices tbody tr { display: block; border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px 16px; margin-bottom: 12px; }
    table.invoices tbody tr:hover td { background: transparent; }
    table.invoices tbody tr.row-paid { background: var(--success-25); }
    table.invoices tbody tr.row-paid td { background: transparent; }
    table.invoices tbody td { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 4px 0 !important; border-bottom: none; text-align: right; }
    table.invoices tbody td::before { content: attr(data-label); font-weight: 500; color: var(--text-secondary); font-size: 12.5px; text-align: left; flex: none; }
    table.invoices tbody td.cust-cell { display: block; text-align: left; margin-bottom: 6px; }
    table.invoices tbody td.cust-cell::before { display: none; }
    table.invoices tbody td.act { display: block; margin-top: 12px; }
    table.invoices tbody td.act::before { display: none; }
    table.invoices tbody td.act .btn { width: 100%; }
    .sent-cell { align-items: stretch; width: 100%; }
    .sent-actions { justify-content: flex-start; }
    .state-help { text-align: left; max-width: none; }
    .step-foot { padding: 14px 16px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

  <div class="nav-inner">

<main class="shell">
  <div id="bannerSlot"></div>
  <section class="card step-card" id="stepCard" aria-label="Send payment links on open invoices"></section>
  <section class="nexts" id="nextsSlot" aria-label="Next steps"></section>
</main>

<div class="toast-wrap" id="toastWrap"></div>
<div class="sr-only" id="live" aria-live="polite" role="status"></div>

<script>
"use strict";

/* =========================================================================
   FIN-2045 - send a payment link on open invoices after approval.

   These constants stand in for backend account state + feature flags:
     ACCOUNT_STATUS   "enabled" | "payouts_pending" | "requirements_due"
     SCOPE            "single"  | "account"   (account adds a Location column)
     ACH_ENABLED      card + ACH, or card only
     SOUTH_BRANCH_EIN "same"    | "different" (drives the add-location card)

   Every payment carries job_id and location_id metadata.
   paid / processing / failed row states come from Stripe payment events.
   ========================================================================= */
var ACCOUNT_STATUS = "enabled";
var SCOPE = "single";
var ACH_ENABLED = true;
var SOUTH_BRANCH_EIN = "same";

var CURRENT_LOCATION = "Main office";
var APPROVAL_DATE = new Date("2026-10-27T00:00:00");
var TODAY = new Date();

// TODO(stripe): confirm the new-account per-charge limit. While null, no warning
// shows; when set, rows above it warn before sending.
var NEW_ACCOUNT_CARD_LIMIT = null;

// Sample invoices. In production these come from the Invoices API.
var MASTER = [
  { id:"1052", cust:"Rivera Rooftop",   job:"JB-5201", loc:"South branch", locId:"loc_south", channel:"text",  contact:"(555) 012-0142", sent:"2026-10-24", due:"2026-11-07", balance:7420.00,  status:"open", hasPaymentLink:false },
  { id:"1048", cust:"Smith Residence",  job:"JB-4821", loc:"Main office",  locId:"loc_main",  channel:"email", contact:"jordan.smith@email.com", sent:"2026-10-22", due:"2026-11-05", balance:18450.00, status:"open", hasPaymentLink:false },
  { id:"1045", cust:"Delgado Property", job:"JB-4777", loc:"Main office",  locId:"loc_main",  channel:"email", contact:"a.delgado@email.com", sent:"2026-10-20", due:"2026-11-03", balance:5110.00,  status:"open", hasPaymentLink:false },
  { id:"1041", cust:"Harbor Point HOA", job:"JB-4590", loc:"South branch", locId:"loc_south", channel:"email", contact:"billing@harborpoint.org", sent:"2026-10-17", due:"2026-10-31", balance:23900.00, status:"open", hasPaymentLink:false },
  { id:"1039", cust:"Garcia Residence", job:"JB-4512", loc:"Main office",  locId:"loc_main",  channel:"text",  contact:"(555) 012-0188", sent:"2026-10-15", due:"2026-10-29", balance:9200.00,  status:"open", hasPaymentLink:false },
  { id:"1036", cust:"Nguyen Residence", job:"JB-4408", loc:"Main office",  locId:"loc_main",  channel:"email", contact:"k.nguyen@email.com", sent:"2026-10-10", due:"2026-10-24", balance:3680.00,  status:"open", hasPaymentLink:false },
  { id:"1033", cust:"Beck Commercial",  job:"JB-4330", loc:"South branch", locId:"loc_south", channel:"email", contact:"ap@beckco.com", sent:"2026-10-06", due:"2026-10-20", balance:14250.00, status:"open", hasPaymentLink:false },
  { id:"1031", cust:"Lakeside HOA",     job:"JB-4201", loc:"Main office",  locId:"loc_main",  channel:"email", contact:"billing@lakesidehoa.org", sent:"2026-10-02", due:"2026-10-16", balance:41775.00, status:"open", hasPaymentLink:false },
  { id:"1028", cust:"Oakmont Property", job:"JB-4120", loc:"Main office",  locId:"loc_main",  channel:"text",  contact:"(555) 012-0164", sent:"2026-09-28", due:"2026-10-12", balance:6300.00,  status:"open", hasPaymentLink:false },
  { id:"1024", cust:"Trent Remodel",    job:"JB-4015", loc:"Main office",  locId:"loc_main",  channel:"email", contact:"dana.trent@email.com", sent:"2026-09-23", due:"2026-10-07", balance:12890.00, status:"open", hasPaymentLink:false },
  { id:"1019", cust:"Cedar Ridge HOA",  job:"JB-3922", loc:"South branch", locId:"loc_south", channel:"email", contact:"board@cedarridge.org", sent:"2026-09-18", due:"2026-10-02", balance:19540.00, status:"open", hasPaymentLink:false },
  { id:"1015", cust:"Powell Residence", job:"JB-3840", loc:"Main office",  locId:"loc_main",  channel:"text",  contact:"(555) 012-0133", sent:"2026-09-12", due:"2026-09-26", balance:4275.00,  status:"open", hasPaymentLink:false }
];

// per-invoice runtime row state, keyed by id
var runtime = {};
MASTER.forEach(function (inv) { runtime[inv.id] = { rowState: "default" }; });
var firstSentLocations = {};

/* helpers */
function money(n) { return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) { return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function parse(s) { return new Date(s + "T00:00:00"); }
function daysSinceApproval() { return Math.max(0, Math.round((TODAY - APPROVAL_DATE) / 86400000)); }
function isOverdue(inv) { return parse(inv.due) < TODAY; }
function methodsLabel() { return ACH_ENABLED ? "card or bank account (ACH)" : "card"; }

/* Eligibility: single source of truth. An open invoice qualifies for a first
   payment link when it has a real balance, was sent before approval, is a
   finalized invoice (not void or draft), has no payment link yet, and is in
   the current scope. */
function inScope(inv) { return SCOPE === "account" ? true : inv.loc === CURRENT_LOCATION; }
function eligibleInvoices() {
  return MASTER.filter(function (inv) {
    return inv.balance > 0
      && parse(inv.sent) < APPROVAL_DATE
      && inv.status !== "void" && inv.status !== "draft"
      && !inv.hasPaymentLink
      && inScope(inv);
  }).sort(function (a, b) { return parse(b.sent) - parse(a.sent); });
}

/* icons */
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
var MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
var PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg>';
var BANK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"/><path d="M4 10v9m16-9v9M8 10v9m4-9v9m4-9v9M3 19h18"/></svg>';
var CARD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>';
var INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
var ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>';
var DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>';
var BUILDING = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/><path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/></svg>';

/* banner */
function renderBanner() {
  var slot = document.getElementById("bannerSlot");

  if (ACCOUNT_STATUS === "requirements_due") {
    slot.innerHTML =
      '<div class="stripe-banner" role="region" aria-label="Stripe notification">'
      + '<span class="stripe-icon" aria-hidden="true">S</span>'
      + '<div>'
      + '  <h2>Stripe needs additional documentation</h2>'
      + '  <p>Your account has requirements due. Payouts may be paused until it is resolved. Card payments on existing invoices can continue.</p>'
      + '  <button class="btn-stripe" data-stripe>Complete verification</button>'
      + '</div></div>';
    slot.querySelector("[data-stripe]").addEventListener("click", function () { toast("Opens Stripe verification", "Stripe hosts this step."); });
    return;
  }

  if (ACCOUNT_STATUS === "payouts_pending") {
    slot.innerHTML =
      '<section class="banner is-pending" aria-label="Payments status">'
      + '<div class="banner-icon" aria-hidden="true">' + INFO + '</div>'
      + '<div class="banner-body">'
      + '  <span class="badge badge-warning"><span class="d"></span>' + CURRENT_LOCATION + ' &middot; Card payments on</span>'
      + '  <h1>You can take card payments</h1>'
      + '  <p>Add a Pay now link to any invoice and customers can pay by card today. Payouts are on hold until Stripe verifies the bank account ending 4821.</p>'
      + '  <span class="payout-chip"><span class="bank-ico">' + BANK + '</span> Payouts pending for bank account <span class="num">ending 4821</span></span>'
      + '</div></section>';
    return;
  }

  slot.innerHTML =
    '<section class="banner is-success" aria-label="Payments approved">'
    + '<div class="banner-icon" aria-hidden="true">' + CHECK + '</div>'
    + '<div class="banner-body">'
    + '  <span class="badge badge-success"><span class="d"></span>' + CURRENT_LOCATION + ' &middot; Approved</span>'
    + '  <h1>You can take payments now</h1>'
    + '  <p>Every invoice you send now has a Pay now button, and so can the open ones below. Payouts go to the bank account ending 4821.</p>'
    + '  <span class="payout-chip"><span class="bank-ico">' + BANK + '</span> Payouts go to the bank account <span class="num">ending 4821</span></span>'
    + '</div></section>';
}

/* step + table */
function paidInvoice() {
  var hit = null;
  MASTER.forEach(function (inv) { if (runtime[inv.id].rowState === "paid" && !hit) hit = inv; });
  return hit;
}

function renderStep() {
  var card = document.getElementById("stepCard");
  var eligible = eligibleInvoices();
  var shown = eligible.slice(0, 5);
  var paid = paidInvoice();

  if (eligible.length === 0 && !paid) {
    card.innerHTML =
      '<div class="empty">'
      + '<span class="eico" aria-hidden="true">' + DOC + '</span>'
      + '<h2>No open invoices need a payment link</h2>'
      + '<p>Every open invoice at ' + (SCOPE === "account" ? "your account" : CURRENT_LOCATION)
      + ' already has a Pay now link, or there are none yet. You can still take a payment.</p>'
      + '<div class="empty-actions">'
      + '  <button class="btn btn-primary" data-send-request>Send a payment request</button>'
      + '  <button class="btn btn-secondary" data-create-invoice>Create an invoice</button>'
      + '</div></div>';
    card.querySelector("[data-send-request]").addEventListener("click", function () { toast("Opens Send payment request", "The existing flow, with no invoice attached."); });
    card.querySelector("[data-create-invoice]").addEventListener("click", function () { toast("Opens Create invoice", "Start a new invoice with Pay now on."); });
    return;
  }

  var head;
  if (paid) {
    head =
      '<div class="paid-head">'
      + '<span class="pico" aria-hidden="true">' + CHECK + '</span>'
      + '<div><span class="eyebrow done">' + CHECK.replace("<svg", '<svg class="ex"') + ' Step 3 of 3 complete</span>'
      + '<h2>First payment received: ' + money(paid.balance) + ' from ' + paid.cust + '</h2>'
      + '<p>Nice. That starts your payments activation. Invoices still waiting keep their Send payment link option below.</p>'
      + '</div></div>';
  } else {
    var sentCount = eligible.filter(function (i) {
      var s = runtime[i.id].rowState; return s === "sent" || s === "paid" || s === "processing";
    }).length;
    var total = eligible.length;
    var scopeLine = SCOPE === "account"
      ? "These open invoices across your account were sent before Pay now existed."
      : "These open invoices at " + CURRENT_LOCATION + " were sent before Pay now existed.";
    head =
      '<div class="step-head">'
      + '<span class="eyebrow">Step 3 of 3</span>'
      + '<h2>Send a payment link on an invoice that\'s already out</h2>'
      + '<p class="step-sub">' + scopeLine + ' Add a link so customers can pay by ' + methodsLabel() + '.</p>'
      + '<div class="progress-note">'
      + '  <span id="progressLabel">' + sentCount + ' of ' + total + ' links sent</span>'
      + '  <div class="progress-track" role="progressbar" aria-label="Payment links sent" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + sentCount + '">'
      + '    <div class="progress-fill" style="width:' + (total ? (sentCount / total * 100) : 0) + '%"></div></div>'
      + '</div></div>';
  }

  var accountScope = SCOPE === "account";
  var thLoc = accountScope ? '<th>Location</th>' : '';
  var tableHead =
    '<thead><tr>'
    + '<th>Customer</th><th>Invoice</th><th>Sent</th><th>Due</th><th>Send to</th>'
    + thLoc + '<th class="num">Balance</th><th class="act"><span class="sr-only">Action</span></th>'
    + '</tr></thead>';

  var rows = shown.map(function (inv) {
    var cls = runtime[inv.id].rowState === "paid" ? ' class="row-paid"' : '';
    return '<tr' + cls + '>' + rowHtml(inv, accountScope) + '</tr>';
  }).join("");

  var viewAll = eligible.length > 5
    ? '<div class="viewall"><a href="#" data-viewall>View all ' + eligible.length + ' open invoices <span aria-hidden="true">&rarr;</span></a></div>'
    : '';

  var foot =
    '<div class="step-foot">'
    + '<span class="foot-note">This step clears once you send all links, take the first payment, or 14 days after approval.</span>'
    + '<button class="btn btn-secondary btn-sm" data-dismiss>Not now</button>'
    + '</div>';

  card.innerHTML = head
    + '<div class="table-wrap"><table class="invoices ' + (accountScope ? 'scope-account' : '') + '" aria-label="Open invoices sent without a payment link">'
    + tableHead + '<tbody>' + rows + '</tbody></table></div>'
    + viewAll + foot;

  wireStep(card);
}

function rowHtml(inv, accountScope) {
  var rt = runtime[inv.id];
  var s = rt.rowState;
  var chanIco = inv.channel === "email" ? MAIL : PHONE;
  var over = isOverdue(inv);
  var dueCell = '<span class="' + (over ? "due-over" : "") + '">' + fmtDate(parse(inv.due)) + (over ? " (overdue)" : "") + '</span>';

  var head = '<td class="cust-cell"><span class="cust">' + inv.cust + '</span></td>'
    + '<td data-label="Invoice"><span class="inv-no mono">#' + inv.id + '</span></td>'
    + '<td data-label="Sent">' + fmtDate(parse(inv.sent)) + '</td>'
    + '<td data-label="Due">' + dueCell + '</td>'
    + '<td data-label="Send to"><span class="sendto">' + chanIco + inv.contact + '</span></td>'
    + (accountScope ? '<td data-label="Location"><span class="loc-pill">' + inv.loc + '</span></td>' : '')
    + '<td class="num" data-label="Balance"><span class="bal mono">' + money(inv.balance) + '</span></td>';

  var action;
  if (s === "default") {
    action = '<button class="btn btn-primary btn-sm" data-send="' + inv.id + '" aria-label="Send payment link for invoice #' + inv.id + ', ' + inv.cust + '">Send payment link</button>';
  } else if (s === "sending") {
    action = '<button class="btn btn-primary btn-sm" disabled>Sending…</button>';
  } else if (s === "sent") {
    action = '<span class="sent-cell"><span class="badge badge-success"><span class="d"></span>Link sent ' + rt.sentOn + '</span>'
      + '<span class="sent-actions"><button class="linklike" data-copy="' + inv.id + '">Copy link</button>'
      + '<button class="linklike" data-send="' + inv.id + '">Resend</button></span></span>';
  } else if (s === "failed") {
    action = '<span class="sent-cell"><span class="badge badge-error"><span class="d"></span>Couldn\'t send</span>'
      + '<span class="sent-actions"><button class="linklike" data-send="' + inv.id + '">Retry</button></span></span>';
  } else if (s === "paid") {
    action = '<span class="sent-cell"><span class="badge badge-paid">' + CHECK.replace("<svg", '<svg width="13" height="13"') + ' Paid by card ' + rt.paidOn + '</span></span>';
  } else if (s === "processing") {
    action = '<span class="sent-cell"><span class="badge badge-info"><span class="d"></span>Processing (ACH)</span>'
      + '<span class="state-help">Bank payments take up to 4 business days.</span></span>';
  }
  return head + '<td class="act">' + action + '</td>';
}

function wireStep(card) {
  card.querySelectorAll("[data-send]").forEach(function (b) {
    b.addEventListener("click", function () { openSendModal(b.getAttribute("data-send")); });
  });
  card.querySelectorAll("[data-copy]").forEach(function (b) {
    b.addEventListener("click", function () {
      var inv = find(b.getAttribute("data-copy"));
      var url = "https://pay.jobnimbus.com/i/" + inv.id;
      var done = function () { toast("Payment link copied", url); };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(done, done); }
      else { done(); }
    });
  });
  var va = card.querySelector("[data-viewall]");
  if (va) va.addEventListener("click", function (e) { e.preventDefault(); toast("Opens Invoices", "Filtered to open invoices with no payment link."); });
  var dz = card.querySelector("[data-dismiss]");
  if (dz) dz.addEventListener("click", function () { toast("Hidden for now", "Find open invoices in Invoices anytime."); });
}

function find(id) { return MASTER.filter(function (i) { return i.id === id; })[0]; }

/* send flow (the existing Send payment request flow, prefilled) */
function openSendModal(id) {
  var inv = find(id);
  var rt = runtime[id];
  var isResend = rt.rowState === "sent";
  var isRetry = rt.rowState === "failed";
  var chan = inv.channel === "email" ? "Email" : "Text";
  var overLimit = NEW_ACCOUNT_CARD_LIMIT != null && inv.balance > NEW_ACCOUNT_CARD_LIMIT;

  var limitWarn = overLimit
    ? '<div class="limit-warn">' + ALERT + '<span>This invoice is above your new-account limit of ' + money(NEW_ACCOUNT_CARD_LIMIT) + '. The customer may need to pay in parts until Stripe raises it.</span></div>'
    : '';
  var title = isResend ? "Resend payment link" : (isRetry ? "Retry payment link" : "Send payment link");
  var cta = isResend ? "Resend link" : (isRetry ? "Retry send" : "Send payment link");

  var m = openModal(
    '<div class="modal-featured">' + MAIL + '</div>'
    + '<h3>' + title + '</h3>'
    + '<p class="modal-sub">We\'ll ' + (inv.channel === "email" ? "email" : "text") + ' a secure Pay now link for this invoice. Nothing else about the invoice changes.</p>'
    + '<div class="summary-box">'
    + '  <div class="summary-row"><span class="k">Customer</span><span class="v">' + inv.cust + '</span></div>'
    + '  <div class="summary-row"><span class="k">Invoice</span><span class="v mono">#' + inv.id + '</span></div>'
    + '  <div class="summary-row"><span class="k">Balance due</span><span class="v mono">' + money(inv.balance) + '</span></div>'
    + '  <div class="summary-row"><span class="k">' + chan + ' to</span><span class="v">' + inv.contact + '</span></div>'
    + '  <div class="summary-row"><span class="k">Job &middot; Location</span><span class="v mono">' + inv.job + ' &middot; ' + inv.locId + '</span></div>'
    + '</div>'
    + '<div class="fee-line">' + CARD + 'Card fee: Main office covers it &middot; <a href="#" data-fee>Change</a></div>'
    + '<div class="methods-line">' + (ACH_ENABLED ? BANK : CARD) + 'Customer can pay by ' + methodsLabel() + '</div>'
    + limitWarn
    + '<div class="modal-actions">'
    + '  <button class="btn btn-secondary" data-close>Cancel</button>'
    + '  <button class="btn btn-primary" data-confirm="' + inv.id + '">' + cta + '</button>'
    + '</div>'
  );
  m.querySelector("[data-close]").addEventListener("click", closeModal);
  m.querySelector("[data-fee]").addEventListener("click", function (e) { e.preventDefault(); toast("Opens card fee settings (FIN-1662)", "Surcharging is set per location, with an attestation step."); });
  var cbtn = m.querySelector("[data-confirm]");
  cbtn.addEventListener("click", function () {
    rt.rowState = "sending"; renderStep();
    cbtn.disabled = true; cbtn.textContent = "Sending…";
    setTimeout(function () { confirmSend(inv.id); }, 650);
  });
}

function confirmSend(id) {
  var inv = find(id);
  runtime[id].rowState = "sent";
  runtime[id].sentOn = fmtDate(TODAY);
  closeModal();
  renderStep();

  // First successful send per location fires payments_first_link_sent; later
  // sends fire payments_link_sent.
  if (!firstSentLocations[inv.locId]) {
    firstSentLocations[inv.locId] = true;
    logEvent("payments_first_link_sent", { invoice_id: inv.id, amount: inv.balance, location_id: inv.locId, days_since_approval: daysSinceApproval() });
  } else {
    logEvent("payments_link_sent", { invoice_id: inv.id, amount: inv.balance, location_id: inv.locId, days_since_approval: daysSinceApproval() });
  }
  toast("Payment link sent to " + inv.cust, "#" + inv.id + " · " + inv.contact);
  announce("Payment link sent to " + inv.cust + ", invoice " + inv.id);
}

function logEvent(name, props) { try { console.log("[analytics]", name, props); } catch (e) {} }

/* bottom cards */
function renderNexts() {
  var slot = document.getElementById("nextsSlot");

  var feeCard =
    '<a class="next-card" href="#" data-fee-card>'
    + '<span class="next-ico" aria-hidden="true">' + CARD + '</span>'
    + '<div style="display:flex;flex-direction:column;gap:5px">'
    + '  <div class="next-title-row"><span class="next-title">You cover the card fee for Main office</span>'
    + '    <span class="badge badge-gray">Settings</span><span class="chev" aria-hidden="true">&rarr;</span></div>'
    + '  <span class="next-sub">Change in payment settings</span>'
    + '</div></a>';

  var sameEin = SOUTH_BRANCH_EIN === "same";
  var locCard =
    '<a class="next-card" href="#" data-loc-card>'
    + '<span class="next-ico" aria-hidden="true">' + BUILDING + '</span>'
    + '<div style="display:flex;flex-direction:column;gap:5px">'
    + '  <div class="next-title-row"><span class="next-title">' + (sameEin ? "Set up South branch" : "Add South branch") + '</span>'
    + '    <span class="chev" aria-hidden="true">&rarr;</span></div>'
    + '  <span class="next-sub">' + (sameEin
        ? "Already approved under your account. Choose card fee and invoice settings."
        : "Separate business, so it needs its own Stripe application.") + '</span>'
    + '  <span class="next-link">' + (sameEin ? "Open location settings" : "Start onboarding") + ' <span aria-hidden="true">&rarr;</span></span>'
    + '</div></a>';

  slot.innerHTML = feeCard + locCard;

  // Note: a "Tell your team" card is a follow-up ticket - it needs data on which
  // reps asked about Pay now before it is built.

  slot.querySelector("[data-fee-card]").addEventListener("click", function (e) { e.preventDefault(); toast("Opens payment settings (FIN-1662)", "Set who covers the card fee, per location."); });
  slot.querySelector("[data-loc-card]").addEventListener("click", function (e) {
    e.preventDefault();
    if (sameEin) toast("Opens South branch settings", "Shares your approved account. Set fee and invoice options.");
    else toast("Starts South branch onboarding", "A separate EIN needs its own Stripe application.");
  });
}

/* toast + live region */
function toast(title, sub) {
  var wrap = document.getElementById("toastWrap");
  var t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = '<span class="tfeat">' + CHECK + '</span><span class="tbody"><span class="tt">' + title + '</span>'
    + (sub ? '<span class="ts">' + sub + '</span>' : '') + '</span>';
  wrap.appendChild(t);
  setTimeout(function () { t.classList.add("out"); setTimeout(function () { t.remove(); }, 320); }, 3400);
}
function announce(msg) { var l = document.getElementById("live"); if (l) { l.textContent = ""; setTimeout(function () { l.textContent = msg; }, 30); } }

/* modal plumbing (focus management + trap) */
var scrim = null, lastFocused = null;
function getFocusable(root) {
  return [].slice.call(root.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter(function (el) { return !el.disabled && el.offsetParent !== null; });
}
function openModal(html) {
  closeModal();
  lastFocused = document.activeElement;
  scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(scrim);
  var modal = scrim.querySelector(".modal");
  var title = modal.querySelector("h3");
  if (title) { title.id = "modalTitle"; modal.setAttribute("aria-labelledby", "modalTitle"); }
  requestAnimationFrame(function () { if (scrim) scrim.classList.add("show"); });
  scrim.addEventListener("click", function (e) { if (e.target === scrim) closeModal(); });
  document.addEventListener("keydown", onModalKey);
  var primary = modal.querySelector(".btn-primary") || getFocusable(modal)[0];
  if (primary) primary.focus();
  return modal;
}
function closeModal() {
  if (!scrim) return;
  document.removeEventListener("keydown", onModalKey);
  var s = scrim; scrim = null;
  s.classList.remove("show");
  setTimeout(function () { s.remove(); }, 180);
  if (lastFocused && lastFocused.focus) { lastFocused.focus(); }
  lastFocused = null;
}
function onModalKey(e) {
  if (e.key === "Escape") { closeModal(); return; }
  if (e.key === "Tab" && scrim) {
    var f = getFocusable(scrim.querySelector(".modal"));
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}

/* init */
renderBanner();
renderStep();
renderNexts();
</script>
